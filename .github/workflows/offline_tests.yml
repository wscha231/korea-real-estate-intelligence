name: Offline QA — no external APIs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests without credentials
        run: |
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests -v
      - name: Verify dry-run scope without API calls
        run: |
          python scripts/collect_lawd.py --dry-run
          python scripts/collect_rtms.py --service trade_detail --lawd 11110 --ymd 202609 --dry-run
